name: Build wheels
run-name: "Build fpsample wheels (${{ github.event_name == 'push' && github.ref_name || 'main' }})"

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} · cp${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["310", "311", "312", "313", "314"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python (host)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fpsample v1.0.2 is pure pybind11 + scikit-build-core. cibuildwheel's
      # default pip-build frontend installs build-system.requires
      # automatically (scikit-build-core, pybind11) and the runners already
      # have gcc (manylinux container) / MSVC (windows-latest image), so
      # no CIBW_BEFORE_* hooks are needed.
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0
        with:
          package-dir: ./fpsample
        env:
          CIBW_BUILD: "cp${{ matrix.python }}-*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # cp314 is still gated behind cpython-prerelease in cibuildwheel v3.0
          # (Python 3.14 only stabilised Oct 2025). Enable explicitly so the
          # cp314 cells can build.
          CIBW_ENABLE: "cpython-prerelease"
          # Skip pypy and musllinux to keep the matrix lean -- only ship the
          # cells comfy-test / comfy-env actually consume.
          CIBW_SKIP: "pp* *-musllinux* *_i686 *-win32"
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-cp${{ matrix.python }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List collected wheels
        run: ls -la dist/

      - name: Upload wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
